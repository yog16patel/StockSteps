# StockSteps — LAN REAL backend (docs/LOCAL_REAL_BACKEND_PLAN.md, approved D-R1 to D-R6). REAL provider data: every request may use paid quota.
#
# A separate Compose project next to the MOCK one (docker-compose.yml): own network, own port, own remote directory. Same image and hardening.
# Driven by `STOCKSTEPS_STACK=real deploy/local/deploy.sh …`. Variables (written to the host's .env by deploy.sh; none are secret):
#   STOCKSTEPS_IMAGE_TAG, STOCKSTEPS_CONTEXT, STOCKSTEPS_BIND_ADDR  as for MOCK
#   STOCKSTEPS_HOST_PORT                                            host port (default 8082)
#   PROVIDER_FMP_PER_MINUTE, PROVIDER_FINNHUB_PER_MINUTE            the owner's verified plan rates (required)
#   PROVIDER_FMP_DAILY_TARGET                                       optional daily target (an alert, not a cap)
# Provider keys come only from ./secrets.env on the host (created by the owner, mode 600, never uploaded or printed).
# No Firebase credentials (D-R1): signed-in user data and push are disabled; public market data and search work. No Gemini key (D-R2).
name: stocksteps-real

services:
  api:
    image: stocksteps-local:${STOCKSTEPS_IMAGE_TAG:?set STOCKSTEPS_IMAGE_TAG}
    build:
      context: ${STOCKSTEPS_CONTEXT:-./src}
      dockerfile: Dockerfile
      platforms: ["linux/amd64"]
    platform: linux/amd64
    env_file:
      - path: ./secrets.env
        required: true
    environment:
      STOCKSTEPS_DATA_MODE: real
      LOG_FORMAT: text
      # Single instance: provider budgets are not divided.
      CLOUD_RUN_MAX_INSTANCES: "1"
      PROVIDER_FMP_PER_MINUTE: ${PROVIDER_FMP_PER_MINUTE:?set STOCKSTEPS_REAL_FMP_PER_MINUTE in server.env}
      PROVIDER_FINNHUB_PER_MINUTE: ${PROVIDER_FINNHUB_PER_MINUTE:?set STOCKSTEPS_REAL_FINNHUB_PER_MINUTE in server.env}
      PROVIDER_BOC_PER_MINUTE: "10"
      # No Gemini key yet (D-R2); a rate keeps the budget set complete (otherwise startup warns "development defaults").
      PROVIDER_GEMINI_PER_MINUTE: "60"
      PROVIDER_FMP_DAILY_TARGET: ${PROVIDER_FMP_DAILY_TARGET:-}
      # D-R3: the same keys may be used from the Mac, so this server takes half the plan; no background screener warm-up.
      PROVIDER_SAFETY_MARGIN: "0.5"
      SCREENER_FUNDAMENTALS_PER_HOUR: "0"
      # No simplified-news store: Firestore needs credentials (D-R1), and SQLite's native library can't load from the noexec /tmp. Simplification
      # also needs Gemini (D-R2); until then the server serves original news ("News simplification storage unavailable" at startup).
    ports:
      # LAN only. Docker refuses to start if the address isn't assigned to the host.
      - "${STOCKSTEPS_BIND_ADDR:?set STOCKSTEPS_BIND_ADDR to the host LAN IP}:${STOCKSTEPS_HOST_PORT:-8082}:8080"
    networks: [stocksteps-real]
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    cpus: 1.0
    mem_limit: 1g
    restart: unless-stopped
    stop_grace_period: 10s
    healthcheck:
      # /health/ready never calls providers.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "--max-time", "3", "http://127.0.0.1:8080/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  stocksteps-real:
    name: stocksteps-real
    driver: bridge
